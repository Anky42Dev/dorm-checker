<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявка на заселение в общежитие</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    background: #f4f6f9;
    min-height: 100vh;
  }
  .app-wrapper {
    max-width: 560px;
    margin: 48px auto;
  }
  .check-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .check-icon.pass { background-color: var(--bs-success); }
  .check-icon.fail { background-color: var(--bs-danger); }
  #result-card, #spinner, #error-box {
    display: none;
  }
</style>
</head>
<body>

<div class="app-wrapper px-3">

  <h1 class="text-center h4 mb-1">Заявка на заселение в общежитие</h1>
  <p class="text-center text-muted mb-4">Проверка условий заселения студента в комнату</p>

  <div class="card shadow-sm mb-3">
    <div class="card-body p-4">
      <form id="request-form" novalidate>
        <div class="mb-3">
          <label for="student-id" class="form-label fw-semibold">ID студента</label>
          <input type="number" class="form-control" id="student-id" placeholder="например, 1" min="1" required>
        </div>
        <div class="mb-3">
          <label for="building-number" class="form-label fw-semibold">Номер корпуса</label>
          <input type="number" class="form-control" id="building-number" placeholder="например, 1" min="1" required>
        </div>
        <div class="mb-3">
          <label for="room-number" class="form-label fw-semibold">Номер комнаты</label>
          <input type="number" class="form-control" id="room-number" placeholder="например, 101" min="1" required>
          <div class="form-text">Например: 101, 102, 103, 201, 202, 203</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="submit-btn">Проверить заявку</button>
      </form>

      <div id="spinner" class="text-center text-muted mt-3">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        Проверка данных…
      </div>

      <div id="error-box" class="alert alert-danger mt-3 mb-0"></div>
    </div>
  </div>

  <div class="card shadow-sm" id="result-card">
    <div class="card-body p-4">
      <div id="status-banner" class="alert text-center fw-bold fs-5" role="alert"></div>
      <ul class="list-group" id="checks"></ul>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_BASE = "https://inai-col1.fishrungames.com";

  const form = document.getElementById("request-form");
  const submitBtn = document.getElementById("submit-btn");
  const spinner = document.getElementById("spinner");
  const errorBox = document.getElementById("error-box");
  const resultCard = document.getElementById("result-card");
  const statusBanner = document.getElementById("status-banner");
  const checksEl = document.getElementById("checks");

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) {
      throw new Error(`Запрос ${url} вернул ошибку ${res.status}`);
    }
    return res.json();
  }

  function renderCheck(passed, label, detail) {
    const item = document.createElement("li");
    item.className = "list-group-item d-flex align-items-start gap-2";
    item.innerHTML = `
      <span class="check-icon ${passed ? "pass" : "fail"}">${passed ? "✓" : "✕"}</span>
      <span>
        <span class="d-block fw-semibold">${label}</span>
        <span class="d-block text-muted small">${detail}</span>
      </span>
    `;
    checksEl.appendChild(item);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const studentId = document.getElementById("student-id").value.trim();
    const buildingNumber = document.getElementById("building-number").value.trim();
    const roomNumber = document.getElementById("room-number").value.trim();

    errorBox.style.display = "none";
    resultCard.style.display = "none";
    checksEl.innerHTML = "";
    spinner.style.display = "block";
    submitBtn.disabled = true;

    try {
      const [student, building, room] = await Promise.all([
        fetchJson(`${API_BASE}/students/${studentId}`),
        fetchJson(`${API_BASE}/buildings/${buildingNumber}`),
        fetchJson(`${API_BASE}/rooms/${roomNumber}`)
      ]);

      // Условие 1: студент иногородний (не является местным резидентом)
      const isNonResident = student.resident === false;
      // Условие 2: корпус предназначен для студентов
      const isBuildingForStudents = building.forStudents === true;
      // Условие 3: комната свободна
      const isRoomAvailable = room.available === true;

      const allPassed = isNonResident && isBuildingForStudents && isRoomAvailable;

      renderCheck(
        isNonResident,
        "Иногородний студент",
        `Студент: ${student.name ?? student.id} — ${student.resident ? "местный (не иногородний)" : "иногородний"}`
      );
      renderCheck(
        isBuildingForStudents,
        "Корпус предназначен для студентов",
        `Корпус №${building.building_number} — ${building.forStudents ? "для студентов" : "не для студентов"}`
      );
      renderCheck(
        isRoomAvailable,
        "Комната свободна",
        `Комната №${room.room_number} — ${room.available ? "свободна" : "занята"}`
      );

      statusBanner.textContent = allPassed
        ? "✅ Заявка одобрена — заселение разрешено"
        : "❌ Заявка отклонена";
      statusBanner.className = "alert text-center fw-bold fs-5 " + (allPassed ? "alert-success" : "alert-danger");

      resultCard.style.display = "block";
    } catch (err) {
      errorBox.textContent = "Ошибка: " + err.message + ". Проверьте, что введённые ID существуют.";
      errorBox.style.display = "block";
    } finally {
      spinner.style.display = "none";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
